<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
<style>
h1, h2 { font-family: Georgia, serif; font-weight: 700; color: #16202B; }
h1 { margin: 0 0 20px; font-size: 26px; line-height: 1.3; }
h2 { margin: 0 0 6px; font-size: 18px; line-height: 1.4; }
p { margin: 0 0 16px; }
</style>
</head>
<body style="margin: 0; padding: 0; background: #F5F3EE; color: #16202B; font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background: #F5F3EE;">
<tr>
<td align="center" style="padding: 24px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width: 600px; max-width: 100%;">
<tr>
<td style="background: #FFFFFF; border: 1px solid #E2DDD3; border-radius: 12px; padding: 32px; color: #16202B; font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; font-size: 16px; line-height: 1.55;">
<div style="font-family: Georgia, serif; font-size: 22px; font-weight: 700; margin: 0 0 20px;">Headroom</div>
{% block content %}{% endblock %}
</td>
</tr>
<tr>
<td style="padding: 20px 8px 0; font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif; font-size: 13px; line-height: 1.6; color: #5A6370;">
<p style="margin: 0 0 8px;">{{ reason }}</p>
<p style="margin: 0 0 8px;"><a href="{{ preferences_url }}" style="color: #1D4E89;">Email preferences</a> · <a href="{{ unsubscribe_url }}" style="color: #1D4E89;">Unsubscribe</a></p>
<p style="margin: 0;">Headroom · {{ mailing_address }}</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
