<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding step 2: your business</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F5F3EE;color:#16202B;font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif}
a{color:#1D4E89}a:hover{color:#133A68}
button,input,select{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 28px; background: #F5F3EE; color: #16202B; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
<div style="font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Headroom</div>
<div style="font-size: 13px; color: #454F5C">Step 2 of 5</div>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<div style="height: 4px; border-radius: 2px; background: {{accent}}"></div>
<div style="height: 4px; border-radius: 2px; background: {{accent}}"></div>
<div style="height: 4px; border-radius: 2px; background: #E2DDD3"></div>
<div style="height: 4px; border-radius: 2px; background: #E2DDD3"></div>
<div style="height: 4px; border-radius: 2px; background: #E2DDD3"></div>
</div>
</header>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2">Tell us about your business</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #454F5C">Your time zone decides when alerts and your weekly email arrive.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="business-name" style="font-size: 14px; font-weight: 600">Business name</label>
<input id="business-name" type="text" value="Harbor Street Plumbing" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border: 1px solid #D6D0C4; border-radius: 10px; background: #FFFFFF; color: #16202B; font-size: 16px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="province" style="font-size: 14px; font-weight: 600">Province or territory</label>
<select id="province" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 12px; border: 1px solid #D6D0C4; border-radius: 10px; background: #FFFFFF; color: #16202B; font-size: 16px"><option>Ontario</option></select>
<div style="font-size: 13px; color: #5A6370">Headroom isn't available in Quebec yet.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="time-zone" style="font-size: 14px; font-weight: 600">Time zone</label>
<select id="time-zone" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 12px; border: 1px solid #D6D0C4; border-radius: 10px; background: #FFFFFF; color: #16202B; font-size: 16px"><option>Eastern Time (Toronto)</option></select>
<div style="font-size: 13px; color: #5A6370">Filled in from your device. Change it if it's wrong.</div>
</div>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column">
<button type="button" style="min-height: 52px; border: none; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600">Continue</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D4E89","options":["#1D4E89","#0F5C5A","#4B3A8C","#16202B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1D4E89' };
  }
}
</script>
</body>
</html>
